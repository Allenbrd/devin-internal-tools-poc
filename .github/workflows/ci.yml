name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Target Postgres (same schema, provider swapped)
        if: matrix.db == 'postgresql'
        run: |
          npx tsx scripts/use-postgres.ts
          npx prisma generate
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/itp_test?schema=public" >> "$GITHUB_ENV"
      - run: npm test

  fresh-clone:
    name: Fresh clone setup (npm install && db:setup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - run: npm run db:setup
      - name: Dev server serves the sign-in page
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/sign-in | grep -q "Adam Admin"; then echo "sign-in OK"; exit 0; fi
            sleep 2
          done
          cat dev.log
          exit 1
